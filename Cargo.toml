[workspace]
resolver = "2"
members = [
    "crates/nilestream-ledger",
    "crates/nilestream-core",
    "crates/nilestream-server",
    "crates/niles-ir",
    "crates/niles-lang",
    "crates/conservation-suite",
    "crates/bank-bench",
    "crates/nilestream-optimizer",
    "crates/proto-engine",
    "crates/experiments",
    "crates/nilesc",
    "crates/nilestream",
    "crates/nilestream-consensus",
    "crates/niles-interp",
]

# **The memory instrument is not part of the system.** `GlobalAlloc` cannot be implemented
# without `unsafe`, and §9.10 claims the workspace has none. `tools/memprobe` measures the
# workspace from outside it and is linked into nothing that ships. The exception is asserted
# to be exactly one file by `the_only_unsafe_in_the_repository_is_the_measurement_tool`.
exclude = ["tools/memprobe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
authors = ["Sergio"]
