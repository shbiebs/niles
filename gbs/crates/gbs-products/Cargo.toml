[package]
name = "gbs-products"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# PRODUCTS ARE COMPOSITIONS. This dependency list is the falsifiable claim of
# ARCHITECTURE.md §1, and `gbs/tests/layering.rs` fails the build if it grows an entry
# below `gbs-mechanisms`. A product that needs a kernel change cannot be written without
# breaking that test, which is what makes "banking as a library" mechanical rather than a
# matter of taste.
[dependencies]
gbs-kernel = { path = "../gbs-kernel" }
gbs-mechanisms = { path = "../gbs-mechanisms" }
