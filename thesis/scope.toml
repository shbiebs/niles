[[component]]
id = "targets"
short = "the native and WASM compilation targets"
component = "Compilation targets: native Linux and macOS on ARM64, Windows on x86-64, WSL and WASM"
status = "specification and future work"
decision = "A-3 (2026-09-21), with cycle 14's D-3 keeping the chapter as specification"
built = "nothing: nilesc lowers to the typed IR and has no back end"
where = "Appendix C, Appendix G.6, Appendix G.7"

[[component]]
id = "optimizer"
short = "the online materialization optimizer of C5"
component = "The online adaptive materialization optimizer (C5)"
status = "specification and future work"
decision = "A-3 (2026-09-21) shrank the optimizer to the planner and stopped the online optimizer"
built = "the planner kept by A-3 (crates/nilestream-optimizer: unnesting, join ordering, three eviction rules); no estimator, no hysteresis schedule, no rent-or-buy break-even"
where = "§4.6, Appendix I"

[[component]]
id = "commitments"
short = "homomorphic commitments for confidential columns"
component = "Committed (homomorphic) commitments for confidential columns"
status = "specification and future work"
decision = "A-3 (2026-09-21): confidentiality labels stay and are checked; the commitments stop"
built = "the labels and their flow check in crates/niles-lang; no commitment scheme"
where = "§6.20, §6.21, §6.22, Appendix B.13"
