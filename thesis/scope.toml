# The scope of every component of this project, in one place.
#
# WHY THIS FILE EXISTS
#
# Decision A-3 (the author, 2026-09-21) stopped four components: the self-hosting bootstrap,
# the MySQL listener, consensus and distribution, and the online optimizer. It kept their
# chapters as specification. Nothing then said so where a reader meets them: the abstract
# still promised MySQL wire compatibility, the conclusion still called Nilestream
# "wire-compatible with MySQL and PostgreSQL", and §7's opening said there was "no wire
# protocol" while §7.5 described the one that is built. A component's scope was written in
# six places, and the six had drifted exactly as claim statuses had before `status.toml`.
#
# Decisions DB-1, DB-8 and DB-11 (cycle 16) then moved the product: the language is
# PostgreSQL's SQL and PL/pgSQL with a checked dialect, the engine is PostgreSQL extended in
# SQL and PL/pgSQL first, and Nilestream and the Niles grammar are the theory's instrument and
# specification.
#
# `thesis/include-results.py` renders this file into the abstract, §1.9, §7, §8,
# `docs/ROADMAP.md`, and a scope line at the head of every appendix or section that describes
# a stopped component. `crates/bank-bench/tests/thesis_drift.rs` fails the build if any of them
# is out of date, or if a stopped component's chapter has no scope line.
#
# FIELDS (one-line basic strings only; the reader is the same subset parser as status.toml's)
#
#   id         the identifier a scope line is rendered by: <!-- BEGIN:scope-<id> ... -->
#   component  what it is, in a few words
#   short      the same, as a phrase that reads inside a sentence (the abstract's summary)
#   status     one of:
#                product      the thing the project ships: what "the system" means
#                instrument   built and kept to test the theory; not the product
#                reference    built and kept as the specification other parts are tested against
#                specification and future work
#                             stopped or never started; its chapter is a design, and nothing in
#                             it is evaluated
#   decision   the decision that set the status, with its date or cycle
#   built      what exists in a repository today, named by path. Required, and "nothing" is
#              an answer: a stopped component often has partial code, and the reader is owed
#              both facts
#   where      the chapters that describe it

[[component]]
id = "pg-engine"
short = "PostgreSQL as the engine, with the append-only ledger, the REV mechanism and the checks"
component = "The engine: PostgreSQL with the append-only ledger, the REV mechanism and the checks"
status = "product"
decision = "DB-1 (cycle 16): PostgreSQL is the product engine, whatever the engine comparison (H-E1) finds; DB-11: extended in SQL and PL/pgSQL first, with a compiled extension only where a measurement shows SQL is the bottleneck"
built = "E14 rebuilt the REV mechanism in stock PostgreSQL 16 (§6.10.3), and it runs as E27's P+ arm (crates/comparator); crates/rev-sidecar is the hybrid H3 (a PostgreSQL ledger with a REV sidecar). No packaged PostgreSQL ledger schema ships yet"
where = "§6.10.3, §9.14, results/E27-comparator.md"

[[component]]
id = "dialect"
short = "PostgreSQL's SQL and PL/pgSQL with a checked dialect as the language"
component = "The language: PostgreSQL's SQL and PL/pgSQL with a checked dialect"
status = "product"
decision = "DB-8 (cycle 16, confirmed by the author 2026-10-01), on the measurements H-L1 (E14 counterproposal) and H-L2 (E30b')"
built = "crates/nilescheck-sql: a catalog checker reading annotations from PostgreSQL comments, with linearity, conservation through niles-lang's solver, capabilities, declared effects and body typing. Enforcement at DDL time is not built (cycle 16, C16-10)"
where = "§6.10.3, §9.11, results/E14-minimal-counterproposal.md, results/E30b-syntax.md"

[[component]]
id = "niles"
short = "Niles, its full grammar, type system and calculus"
component = "Niles: the full grammar, type system and consistency-effect calculus"
status = "reference"
decision = "H-L1 retired the grammar to a specification; DB-8 made Niles the specification of the dialect's semantics and the reference checker it is tested against. It does not replace SQL"
built = "crates/niles-lang (the stage-0 front end, the checker and lowering to the IR), crates/nilesc, crates/niles-interp"
where = "§6, Appendix B, §4.5"

[[component]]
id = "nilestream"
short = "Nilestream's ledger write path, REV runtime and reference oracle"
component = "Nilestream: the ledger write path, the REV runtime and the reference oracle"
status = "instrument"
decision = "A-3 kept it (2026-09-21); DB-1 made it the theory's instrument and reference REV implementation, not the product engine"
built = "crates/nilestream-ledger, crates/nilestream-core, crates/conservation-suite, crates/proto-engine"
where = "§7.1, §7.4, Appendix D, Appendix K"

[[component]]
id = "pg-wire"
short = "Nilestream's PostgreSQL wire surface"
component = "Nilestream's PostgreSQL wire surface"
status = "instrument"
decision = "A-3 kept it (2026-09-21)"
built = "crates/nilestream-server: PostgreSQL protocol v3, simple and extended query paths, driven by psql in conformance tests; no binary result format and no SCRAM"
where = "§7.3, §7.5, Appendix D.4"

[[component]]
id = "gbs"
short = "GBS, a core-banking system whose product goal is to replace Loan IQ and Calypso"
component = "GBS: a core-banking system in Rust, whose product goal is to replace Loan IQ and Calypso"
status = "product"
decision = "DB-4 (GBS's backend is PostgreSQL), DB-5 (replacing Loan IQ and Calypso is the product goal; the thesis evaluates only what is built), DB-10 (pricing and risk through ORE as a separate process)"
built = "a separate, private repository: the kernel, the mechanisms and the products, with a Nilestream adapter held by its G3 correctness suite. Its PostgreSQL backend and the G3p suite are cycle 16's C16-05, not yet run"
where = "§11.4"

[[component]]
id = "mysql"
short = "the MySQL wire listener"
component = "The MySQL wire listener (\"the MySQL replacement\")"
status = "specification and future work"
decision = "A-3 (2026-09-21) stopped the listener"
built = "a packet codec only (crates/nilestream-server/src/mysql_wire.rs, with tests); nothing calls it and no socket accepts MySQL clients"
where = "§7.3, §11.5.4, Appendix D.4"

[[component]]
id = "native-protocol"
short = "the native frame protocol"
component = "The native Nilestream frame protocol"
status = "specification and future work"
decision = "never scheduled; Appendix D.4 has described it as specification since cycle 9"
built = "nothing"
where = "Appendix D.4"

[[component]]
id = "distributed"
short = "distributed execution, consensus and cross-shard commit"
component = "Distributed execution, consensus and the cross-shard commit protocol"
status = "specification and future work"
decision = "A-3 (2026-09-21) stopped consensus and distribution"
built = "a single-process deterministic simulator: crates/nilestream-consensus (a replicated ledger group and two-phase commit over groups, cross_shard.rs) and crates/nilestream-core/src/distributed.rs. None of it has run over a network"
where = "§8.5, §8.6, §8.7, Appendix G.8"

[[component]]
id = "bootstrap"
short = "the self-hosting compiler"
component = "The self-hosting compiler"
status = "specification and future work"
decision = "A-3 (2026-09-21) stopped the bootstrap"
built = "stage 0 and the first front-end stage only: crates/niles-interp (an interpreter for the imperative subset), bootstrap/lexer.niles and bootstrap/parser.niles. Nothing from Appendix E.6 onward"
