[[claim]]
id = "SC7"
claim = "Per-key checkpoints, and the bound C/2 + 1 in expectation over anchors uniform between checkpoints."
status = "measured"
where = "§9.4.1"
instrument = "promoted to a named contribution by measurement rather than stated in advance: without checkpoints the cost law of C3 is false, and the mechanism that makes it true was found by the experiment that refuted the claim without it."
