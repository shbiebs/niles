# The status of every claim in this thesis, in one place.
#
# WHY THIS FILE EXISTS
#
# The status of a claim was written in five places: §1.6's per-hypothesis lines, §1.9's
# statement, §3.15's verification table, the Abstract's status paragraph, and Appendix K.3.
# Five copies of a fact is five facts, and they had drifted: the Abstract said "no
# measurements have been taken yet" while §9.1 opened with "measurements that were actually
# taken", and §1.9 and K.3 disagreed about which hypotheses had runners.
#
# `thesis/include-results.py` renders this file into the generated blocks in those places, and
# `crates/bank-bench/tests/thesis_drift.rs` fails the build if any of them is out of date. A
# status changed here changes everywhere or nowhere.
#
# FIELDS
#
#   id         the identifier used in the text: H-F1..H-F4, H-S1..H-S10, C1..C6, SC7
#   claim      one line, in the present tense
#   status     one of: measured | partly measured | proved | specified | argued |
#              not measured | refuted | withdrawn
#
#              `specified` means a design exists and nothing implements it, which is a
#              different thing from an unmeasured implementation. `argued` means the claim is
#              established by argument and no instrument will settle it -- recording those as
#              `not measured` promised a measurement that was never coming.
#              `withdrawn` means the claim has been taken back: it is not awaiting a
#              measurement and it is not refuted by one, the project has stopped making it.
#              **This status exists because H-S9 did not have a row here at all.** It was
#              withdrawn in §1.6.2 and nowhere else, so the one file that is supposed to be
#              the single source of claim status ran H-S8 -> H-S10 and a reader checking the
#              register would not have found the claim to learn it was gone. A withdrawn
#              claim that the register does not mention is a claim that can walk back in.
#   where      the section that reports it, or the section that states what would
#   instrument for anything not measured: the thing that does not exist yet. Required.
#              "A hypothesis with no runner is a hypothesis with no status" — naming the
#              missing instrument is what keeps "not measured" from being a shrug.

[[claim]]
id = "H-F1"
claim = "Streaming data is unbounded, and finite-assuming designs pay for it."
status = "argued"
where = "§1.6.1, §3.16"
instrument = "**argued, and not measurable by this project.** No long-horizon experiment exists -- no live-generating source, no finite-first comparison stack, no regression of per-answer cost on accumulated input -- and building one would measure a property of the comparison stack rather than of unboundedness. The mismatch catalogue of §3.16 is the argument and is the evidence; `not measured` implied an instrument was coming."

[[claim]]
id = "H-F2"
claim = "A relation is the integral of its changelog, and a changelog the derivative of a relation."
status = "proved"
where = "§3.16, and E2: a scanning fold of the base against the engine's per-epoch incremental fold, at every epoch"
instrument = "E2 was a tautology until this cycle -- it integrated a changelog, differentiated the result and integrated again, which is a telescoping sum compared with its own parts inside one function, and no input could have made it report a mismatch. The two sides now come from `Ledger::reconstruct_balance_scan` and `PartialView::apply_epoch`, and the experiment runs a sabotaged control that withholds one epoch's deltas and asserts the comparison notices."

[[claim]]
id = "H-F3"
claim = "A database language and DBMS should be built for H-F1 and H-F2."
status = "argued"
where = "§1.6.1, §4.7"
instrument = "**argued.** The generality half is discharged by proof (§4.7, narrowed to denotation-preservation over the fragment the compiler accepts). The operational half -- components, hand-written consistency code, admitted anomaly classes -- is a normative claim about how systems *should* be built, and §9.7 fixes counting rules for a comparative audit that would still be an argument with numbers attached. Recorded as argued rather than as awaiting an instrument that was never going to settle it."

[[claim]]
id = "H-F4"
claim = "The aligned shape is an immutable, fully retained base plus dynamic derived state."
status = "measured"
where = "Theorem 4.1, and E1/E4's wipe-and-reconstruct comparisons"
instrument = ""

[[claim]]
id = "H-S1"
claim = "Partiality pays when memory is dear, at an interior budget."
status = "refuted"
where = "§9.3"
instrument = "the directional half — 'the advantage grows with skew' — is refuted and restated; the memory-price condition is measured. The original wording is retained in Appendix J.9."

[[claim]]
id = "H-S2"
claim = "The frontier is real and sits where the theorem says."
status = "partly measured"
where = "§9.3, §9.14.1, results/E16-band.md"
instrument = "a crossover in memory price exists and was located. **The theorem's band was not derived and is not tested**, because Θ(Z) carries no stated constant anywhere in the thesis: a band computed with the constant at 1 and one computed with it at 10 differ by an order of magnitude in exactly the region the experiment measures. `results/E16-band.md` pre-registers the one-sided prediction that is derivable."

[[claim]]
id = "H-S3"
claim = "The price of consistency is workload-shaped, not history-shaped, given a bounding mechanism."
status = "partly measured"
where = "§9.4.1, §9.4.3"
instrument = "**the two halves ran at opposite checkpoint intervals and nothing recorded it, and cycle 13's E-4 measured the difference rather than assuming it.** The rung half is E8 (§9.4.3); the history half is E10, the only experiment here that varies C, and it is what SC7 rests on. E8 ran only at `checkpoint_interval = 0` -- `Ledger::new()`'s default -- which is the configuration §9.4.1 states the cost law does *not* hold in, so a claim whose proviso is \"given a bounding mechanism\" rested on a read-side leg measured without one. E-4 reran E8 at C in {0, 16, 64}: the paired lax:strict read ratio is 2.52x +/- 0.05 at C = 0 and 1.98x +/- 0.00 at C = 16, while misses, deltas applied, maintenance passes and hit rate are identical to the unit at every interval -- a checkpoint changes what a reconstruction costs, not whether a read misses. C = 64 returns to 2.49x because it covers 11 keys of 10,000 against C = 16's 54, which the new `checkpointed_keys` column reports beside the cost. `partly measured` and not `measured` because the history leg (E10) and the rung leg still sample different anchor distributions: E10 probes at the head, and SC7's bound is stated in expectation over anchors uniform between checkpoints, which no experiment samples (item 14 of the audit matrix)."

[[claim]]
id = "H-S4"
claim = "Niles soundness holds in the implementation, not only in the calculus."
status = "partly measured"
where = "§9.14.2, crates/niles-lang/tests/calculus_mutants.rs"
instrument = "27 mutants are refused, each by its own diagnostic code, and the well-typed neighbour of each is accepted; the count is the number of files in `crates/niles-lang/tests/mutants/` and a drift test holds this sentence to it, because the figure stood at `seventeen` through eight cycles in which mutants were added. Cycle 13's L-1 closed the **antecedent** hole this row recorded: `let z: Text = m` with `m: Money<usd>`, a call to an undefined function, and an unbound identifier were all reported `ok` and exit 0, so every sentence of the form *a well-typed program cannot ...* quantified over a set strictly larger than the calculus describes. They are now NL0256, NL0205 and NL0204, and the three are mutants here. Cycle 15's C15-01 closed a fourth of the same kind, E30's finding F12: `?` on a value that is not a `Result` or an `Option` (`credit(b, m)?`) type-checked and raised in the interpreter; it is NL0257, with two mutants here. What remains missing is the *execution* half: no corpus of well-typed programs is run on Nilestream under crash-recovery, eviction and adversarial schedules with an oracle counting violations. The claim quantifies over executions; the evidence is about the checker, and is now about a checker that resolves its names."

[[claim]]
id = "H-S5"
claim = "Generality does not forfeit the floor."
status = "partly measured"
where = "§9.13.3, §9.14.1"
instrument = "the throughput half is measured, and two of §7's four contract rows are NOT MET. The client-compatibility half is not: `psql` drives the PostgreSQL surface in conformance tests, and there is no MySQL listener at all and no pass rate over an unmodified client's query set."

[[claim]]
id = "H-S6"
claim = "Static checkability subsumes runtime policing."
status = "partly measured"
where = "§1.6.2, §6.10.3, §9.11.2, results/obligations.csv"
instrument = "the *discharge* half is now counted: `nilesc report-obligations` over every Niles program in both repositories reports 16 of 16 conservation obligations proved statically, none handed to the runtime seal (§9.11.2). Two cautions travel with it -- a four-file corpus, written by people who knew what the solver proves. The **runtime-overhead** half -- 'at no measurable runtime cost' -- still has no measurement of any kind, and needs a trigger-based SQL baseline and a ported corpus, neither of which exists."

[[claim]]
id = "H-S7"
claim = "The optimizer beats fixed policies and approaches its competitive bound."
status = "not measured"
where = "§4.6, §9.3"
instrument = "the adaptive optimizer of §4.6 is not built (see §4.6's own note: no estimator, no hysteresis schedule, no rent-or-buy break-even), and `offline.rs` is a planner rather than the dynamic program that would compute an offline optimum. There is nothing to measure a competitive ratio against."

[[claim]]
id = "H-S8"
claim = "One engine and one language serve every workload class on a general relational core."
status = "partly measured"
where = "§6.6, §9.11.1, §11.3, examples/inventory.niles"
instrument = "the falsifier was built and run: `examples/inventory.niles` conserves units of a SKU across warehouses, is proved to conserve by the currency-row solver, posts and seals through `nilesc run`, and required no change to the compiler, the IR or the runtime -- a test asserts that none of them contains the word `inventory`, `widget`, `sprocket`, `warehouse` or `sku`. So the refutation condition of §11.3 is **not** met. It is `partly measured` and not `measured` because of what the falsifier found: a money literal's grade must be exactly three lowercase letters in the lexer, so `5 widget` does not lex and every quantity in that file arrives as a parameter. The machinery is general; the notation carries a banking assumption. Recorded as MISMATCH-T-22-currency-literal and deliberately not applied."

[[claim]]
id = "H-S9"
claim = "Lineage is complete and affordable."
status = "withdrawn"
where = "§1.6.2 (the withdrawal), Remark 4.1.2 (what survives), §12 (future work)"
instrument = "**withdrawn, not unmeasured.** `nilestream-lineage` was three `pub mod` lines over three one-line files and is deleted from the workspace (`docs/ROADMAP.md`), so there is no lineage mode to switch between -- no independent variable, nothing to hold constant, nothing to vary. A hypothesis in that state is not awaiting an instrument; it has stopped being a hypothesis. What survives is Remark 4.1.2, which says what the algebra would give over the RA+ fragment and claims nothing about the rest, and §12's semiring-factorization route. Recorded here in cycle 13 because until then this register ran H-S8 -> H-S10 and the withdrawal lived only in §1.6.2."

[[claim]]
id = "H-S10"
claim = "Holds and hot accounts do not break the model."
status = "partly measured"
where = "§9.4.4, §9.14.1, results/E19-scaling.md"
instrument = "the *hot-account* experiment still requires concurrency the instruments do not have: the research prototype is single-threaded and the ledger benchmark serialises through one sealer, so §9.4.4's flat hot-account column measures the absence of an experiment. The **many-readers** half is no longer unmeasured. The clause that said the daemon serves every query under one mutex was struck in cycle 13 and was false for seven cycles: the daemon holds an `Arc<RwLock<RevEngine>>` behind its `Serving` trait object and takes the shared borrow per query step, dropping it before any wait, since `d681f0d` (cycle 6). E-2 then re-measured E19 on the engine that exists (`results/E19-scaling.md`, three interleaved replicates at 1/2/4/8 connections on two granted cores): on `durable` the engine rises 1.72x +/- 0.24 over 2 -> 4 and 1.74x +/- 0.19 over 4 -> 8 against a PostgreSQL control rising 1.23x +/- 0.07 and 1.22x +/- 0.04, where the mutex-era rows were flat at 0.98x; on `fold` both arms are flat above four connections, which on two cores is the host; on `point` the four-connection MADs are 22% and 28% of their medians and no ratio there is claimed. `partly measured` and not `measured` because the comparison across eras is indicative rather than controlled -- different container instances, and this project has a case of an instance alone moving a contract row across its threshold -- and because no experiment holds cycles 6-12's other changes fixed, so nothing here attributes the difference to the lock."

