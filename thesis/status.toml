[[claim]]
id = "H-E1"
claim = "Nilestream is justified as a product: it beats PostgreSQL with the E14 mechanism (P+) and the hybrid (H3) on resident bytes per key ever read and on p99 read latency under eviction, per size range (the engine rule of the cycle-14 round-2 work order, section 7)."
status = "partly measured"
where = "results/E27-comparator.md sections 2, 7 and 8 (memory, correctness, write floor); results/E27-p99-engine.md sections 2 and 8 (p99); results/E27-p99.md (R2-02, N against P+ only)"
instrument = "Evaluated in R2-03 on the container (2 cores, 8 GB), declared synthetic universe (alpha 0.6), five seeds, 10^3 to 10^5 accounts, single- and multi-currency series, arms interleaved. Which run answers which clause, fixed before reading the verdicts: memory is read from the main sweep (the declared 90/10 workload; process PSS growth per distinct key read, judged across seeds); p99 is read from the targeted re-run E27-p99-engine (about 1,000 samples per query per run, N, P+, H3 and T interleaved), on the one-client point reads q1 (head) and q2 (anchored), the four-client rows reported beside them. Memory: N does not beat P+ at any size in either series (P+ better everywhere except single-currency 10^3, no difference); against H3, N is better only at single-currency 10^3, no difference at single 10^4, and H3 is better at single 10^5 and at every multi-currency size. p99: N is better than both P+ and H3 on q1 at every size in both series, except single-currency 10^5 against P+ (no difference); on q2, P+ is better at multi 10^3 and 10^4 (N folds the whole ledger for an anchored multi-currency read), N is better than H3 at single 10^4 and 10^5, and the rest are refused, mixed or no difference (multi 10^5 ran q1 only). Outcome per size range: 'N is justified as a product' is NOT met at any size in 10^3 to 10^5 - N wins the p99 clause on head reads and loses the memory clause to P+ everywhere. The hybrid branch (H3 matches N on both) is not met anywhere: H3 matches or beats N on memory at 10^4 to 10^5 but N beats H3 on q1 p99 at every size. The PostgreSQL-with-E14 branch (P+ matches N on both) is met at single-currency 10^5 only (P+ better on memory, no difference on q1 and q2 p99), not at 10^3 or 10^4 (N better on q1 p99) and not at multi 10^5; the crossover is between 10^4 and 10^5 in the single-currency series. Elsewhere no branch of the rule fires and the result is a trade: N buys lower head-read tails, P+ and H3 fewer bytes per key read. Write floor: T does not beat N and P+ on commits/s (N beats T at 10^3 and 10^4 in both series; P+ against T no difference), so TigerBeetle is not the recommended floor on this host; T is absent at 10^5 (memory cgroup). The rule does not score correctness, which E27 reports beside it: no arm diverged from the oracle; under concurrent writers P+ and M+ exhibited upquery deadlocks and skipped deltas, ReadySet one skipped delta (staleness beyond its bracket), N none; H3 and T were not probed. Not measured: the 10^6 big-lender point (Host C, counted work only, the author's decision), ReadySet and TigerBeetle at 10^5, P and M at multi 10^5 (cited from R2-02's four-arm points), and a view-state byte count (N's wire exposes a resident count only; its PSS includes its in-memory base)."


[[claim]]
id = "H-L1"
claim = "Niles need not exist as a language: a checked, annotated dialect of SQL refuses at check time every defect class and every forgotten-hold spelling the Niles checker refuses (the pre-registered language rule of decision D-2, cycle-14 round-2 work order, section 7)."
status = "measured"
where = "results/E14-minimal-counterproposal.md Part 2 and Part 2b; results/E14-checkcost.md"
instrument = "The rule selects (d). Evaluated in R2-05 over E14's thirteen classes and d14's five spellings of a forgotten hold, each written in Niles and in annotated PostgreSQL 16 SQL (crates/counterproposal/, the d14 corpus committed before any SQL+C+L rule existed). The Niles checker refuses D1 to D12 and all five spellings and warns on D13; SQL+C+L (nilescheck-sql: R2-04's catalog checker plus linearity, conservation through niles-lang's own solver, and capabilities, all read from PostgreSQL comments) refuses the same and warns on D13. Counted by the runs: crates/bank-bench/tests/counterproposal.rs evaluates the rule from nilesc and nilescheck-sql and requires this verdict here. Niles itself was measured refusing three of the five spellings before R2-05 fixed NL0320 (the bare call and a wildcard binding were accepted); the rule is evaluated against the fixed checker. Check time per KLOC is in results/E14-checkcost.md (the rule reports a ratio above 2x as a cost, not a veto). What the verdict does not cover: the corpus is eighteen programs written by the builder of both checkers; SQL+C+L catches D9 and D14 only when the script carries the comments that declare linear and capability domains, where Niles's grammar cannot omit them; and neither checker guards a console session. Consequence under the rule: Niles's grammar is retired to a specification in round 3."
[[claim]]
id = "H-L2"
claim = "Refines H-L1 on a harder corpus: the Niles grammar is needed for exactly the defect classes that SQL+C+L, upgraded with effect annotations, body typing and an error for dynamic SQL in a ledger writer, cannot refuse at check time on an adversarial corpus written before the upgrade (decision DA-1's rule, cycle 15)."
status = "measured"
where = "results/E30b-syntax.md; docs/study/E30b-design.md (pre-registered, commit 163456d)"
instrument = "E30b′ (cycle 15, C15-05). Fourteen adversarial cases over the seven classes the work order names, each a defective program and its correct twin, in SQL (representations R1 and, for the two currency-swap cases, R2) and in Niles where Niles can write them, committed before any addition existed; plus E30's thirty tasks re-run under both SQL money representations with the upgraded checker and with niles-interp's money arithmetic and hold/resolve. The rule counts one class for the Niles grammar: schema-level omission (A01, a hold domain never declared linear; A02, a ledger never declared a ledger). SQL+C+L's rules are keyed on the schema's annotations and fail open when they are missing, while Niles's holds are linear and its conservation applies to every post whatever the schema says. The upgraded SQL+C+L refuses every other defect Niles refuses: the declared-effect mismatches (NL0310) and the currency swaps in typed and untyped positions (NL0255), which H-L1's checker did not. Niles accepts one defect SQL+C+L also accepts (A05, a helper posting one half, undecided and discharged to run time). Three cases are outside Niles because it cannot write either twin (dynamic SQL, triggers, a back-valued correction). The upgraded SQL+C+L refuses one correct twin (A03, dynamic SQL in a ledger writer, by design) and takes 3.4-3.7x Niles's check time per KLOC, a cost, not a veto. Written by the builder of both checkers; one or two cases per class show that a class can slip past a checker, not how often. What the answer implies for the held decisions (1, 4, 5, 6, 8) is the author's to decide."
